name: Update Homebrew packages
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: homebrew-update-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test updater
        run: python3 -m unittest discover -s tests
      - name: Refresh latest npm releases
        if: github.event_name != 'pull_request'
        run: python3 scripts/update.py
      - name: Install and test candidate packages
        run: bash scripts/test-formulae.sh
      - name: Publish validated version updates
        if: github.event_name != 'pull_request'
        run: |
          git add Formula/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'Androperator Releases'
          git config user.email 'releases@androperator.com'
          git commit -m 'chore(homebrew): update verified npm releases'
          git push origin HEAD:main
  review:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests
      - run: bash scripts/test-formulae.sh
